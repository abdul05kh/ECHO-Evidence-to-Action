name: echo_mobile
description: "ECHO — Evidence Capture & Handoff Orchestrator (iQOO Hackathon 2026)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1

  # Native Device Capabilities
  camera: ^0.11.0+2
  record: ^5.1.2
  audioplayers: ^6.0.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.3
  path: ^1.9.0

  # Local Persistence (Drift / SQLite)
  drift: ^2.18.0
  sqlite3: ^2.4.6
  sqlite3_flutter_libs: ^0.5.24

  # Utility & Network
  uuid: ^4.4.0
  intl: ^0.19.0
  http: ^1.2.1
  crypto: ^3.0.3
  speech_to_text: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true

dependency_overrides:
  record_platform_interface: 1.1.0
